workflows:
  ios-sideload:
    name: Unity Asset Editor IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 16.2

    scripts:
      - name: Install .NET 8
        script: |
          curl --fail --silent --show-error --location \
            https://dot.net/v1/dotnet-install.sh \
            --output "$CM_BUILD_DIR/dotnet-install.sh"
          chmod +x "$CM_BUILD_DIR/dotnet-install.sh"
          "$CM_BUILD_DIR/dotnet-install.sh" \
            --version 8.0.422 \
            --install-dir "$CM_BUILD_DIR/.dotnet"
          "$CM_BUILD_DIR/.dotnet/dotnet" --info

      - name: Install the iOS workload
        script: |
          "$CM_BUILD_DIR/.dotnet/dotnet" workload install ios --skip-manifest-update

      - name: Restore packages
        script: |
          "$CM_BUILD_DIR/.dotnet/dotnet" restore \
            PvZAssetEditor.iOS/PvZAssetEditor.iOS.csproj \
            -p:RuntimeIdentifier=ios-arm64

      - name: Build the iPhone app
        script: |
          "$CM_BUILD_DIR/.dotnet/dotnet" publish \
            PvZAssetEditor.iOS/PvZAssetEditor.iOS.csproj \
            --configuration Release \
            --framework net8.0-ios \
            --no-restore \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:EnableDefaultCodesignEntitlements=false \
            -p:ArchiveOnBuild=false \
            -p:BuildIpa=false

      - name: Package the IPA
        script: |
          PUBLISH_ROOT="$CM_BUILD_DIR/PvZAssetEditor.iOS/bin/Release/net8.0-ios/ios-arm64"
          APP_PATH="$(find "$PUBLISH_ROOT" -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "The build completed without producing an .app bundle."
            find "$PUBLISH_ROOT" -maxdepth 4 -print
            exit 1
          fi

          PACKAGE_ROOT="$CM_BUILD_DIR/codemagic-artifacts"
          PAYLOAD_ROOT="$PACKAGE_ROOT/Payload"
          APP_NAME="$(basename "$APP_PATH")"

          mkdir -p "$PAYLOAD_ROOT"
          /usr/bin/ditto "$APP_PATH" "$PAYLOAD_ROOT/$APP_NAME"

          cd "$PACKAGE_ROOT"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload UnityAssetEditor.ipa
          /usr/bin/unzip -t UnityAssetEditor.ipa

    artifacts:
      - codemagic-artifacts/UnityAssetEditor.ipa
      - PvZAssetEditor.iOS/bin/Release/net8.0-ios/ios-arm64/**/*.dSYM
